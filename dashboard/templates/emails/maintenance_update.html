<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#EFF5F9;font-family:Georgia,'Times New Roman',serif;color:#333;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFF5F9;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

<!-- Header -->
<tr><td style="background:#1E3D58;padding:28px 32px 20px;border-radius:8px 8px 0 0;text-align:center;">
  {% if logo_url %}<img src="{{ logo_url }}" alt="Vesta Property Management" width="160" style="display:block;margin:0 auto 8px;">
  {% else %}<p style="margin:0 0 4px;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;font-family:Helvetica,Arial,sans-serif;">VESTA</p>
  {% endif %}
  <p style="margin:0;color:rgba(255,255,255,.7);font-size:13px;font-family:Helvetica,Arial,sans-serif;">Weekly Maintenance Update</p>
</td></tr>

<!-- Body -->
<tr><td style="background:#fff;padding:28px 32px 24px;border-radius:0 0 8px 8px;">
  <div style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#333;">{{ email_body|safe }}</div>
</td></tr>

<!-- Footer -->
<tr><td style="padding:20px 32px;text-align:center;">
  <p style="margin:0 0 6px;font-size:12px;color:#999;">
    <a href="mailto:rodrigo@vestapm.com" style="color:#1E3D58;text-decoration:none;font-weight:600;">Questions? Reply to this email</a>
  </p>
  <p style="margin:8px 0 0;color:#bbb;font-size:11px;">Vesta Property Management &middot; {{ week_start|date:"Y" }}</p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
