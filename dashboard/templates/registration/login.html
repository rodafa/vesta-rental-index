{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Vesta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1E3D58;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
    }
    .login-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E3D58;
      text-align: center;
      margin-bottom: .25rem;
    }
    .login-subtitle {
      font-size: .85rem;
      color: #888;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-group input {
      width: 100%;
      padding: .65rem .75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: .95rem;
      transition: border-color .15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #6EA5CD;
      box-shadow: 0 0 0 2px rgba(110,165,205,.15);
    }
    .login-btn {
      width: 100%;
      padding: .7rem;
      background: #1E3D58;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .login-btn:hover { background: #264D6B; }
    .login-error {
      background: #f8d7da;
      color: #721c24;
      padding: .6rem .75rem;
      border-radius: 4px;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">Vesta</div>
    <div class="login-subtitle">Staff Dashboard Login</div>

    {% if form.errors %}
    <div class="login-error">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</body>
</html>
