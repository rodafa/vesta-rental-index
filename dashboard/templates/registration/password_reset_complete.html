{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset Complete — Vesta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1E3D58;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      text-align: center;
    }
    .card-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E3D58;
      margin-bottom: .25rem;
    }
    .card-subtitle {
      font-size: .85rem;
      color: #888;
      margin-bottom: 1.75rem;
    }
    .message {
      font-size: .9rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: .7rem 2rem;
      background: #1E3D58;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s;
    }
    .btn:hover { background: #264D6B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-brand">Vesta</div>
    <div class="card-subtitle">Password reset complete</div>
    <div class="message">
      Your password has been set. You can now sign in with your new password.
    </div>
    <a href="/accounts/login/" class="btn">Sign In</a>
  </div>
</body>
</html>
