{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Vesta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1E3D58;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
    }
    .card-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E3D58;
      text-align: center;
      margin-bottom: .25rem;
    }
    .card-subtitle {
      font-size: .85rem;
      color: #888;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-group input {
      width: 100%;
      padding: .65rem .75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: .95rem;
      transition: border-color .15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #6EA5CD;
      box-shadow: 0 0 0 2px rgba(110,165,205,.15);
    }
    .btn {
      width: 100%;
      padding: .7rem;
      background: #1E3D58;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .btn:hover { background: #264D6B; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: .85rem;
      color: #6EA5CD;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-brand">Vesta</div>
    <div class="card-subtitle">Enter your email to reset your password</div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email">Email Address</label>
        <input type="email" name="email" id="id_email" autofocus required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <a href="/accounts/login/" class="back-link">Back to login</a>
  </div>
</body>
</html>
