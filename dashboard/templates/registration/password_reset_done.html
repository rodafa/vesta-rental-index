{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check Your Email — Vesta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1E3D58;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      text-align: center;
    }
    .card-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1E3D58;
      margin-bottom: .25rem;
    }
    .card-subtitle {
      font-size: .85rem;
      color: #888;
      margin-bottom: 1.75rem;
    }
    .message {
      font-size: .9rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .back-link {
      font-size: .85rem;
      color: #6EA5CD;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-brand">Vesta</div>
    <div class="card-subtitle">Check your email</div>
    <div class="message">
      If an account exists with that email address, we've sent instructions to reset your password. Check your inbox and spam folder.
    </div>
    <a href="/accounts/login/" class="back-link">Back to login</a>
  </div>
</body>
</html>
