{% extends "dashboard/_base.html" %}
{% load static %}

{% block nav_owners %}active{% endblock %}
{% block title %}Leasing Updates{% endblock %}

{% block content %}
<h1 class="page-title">Leasing Updates</h1>
<p class="page-subtitle">Week of <span id="report-date">Loading...</span></p>

<div id="owner-accordion">
  <div class="loading">Loading owners...</div>
</div>

<div id="page-actions" style="margin-top:1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
  <button class="btn btn-secondary" id="save-all-btn">Save All Drafts</button>
  <button class="btn btn-success" id="send-all-btn">Send All Reviewed</button>
  <span id="ready-count" style="font-size:.85rem;color:var(--text-muted);"></span>
</div>

<div id="email-preview-modal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);">
  <div style="position:absolute;inset:40px;background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:12px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;">
      <strong>Email Preview</strong>
      <button class="btn btn-secondary btn-sm" id="close-preview-btn">Close</button>
    </div>
    <iframe id="preview-iframe" style="flex:1;border:none;width:100%;"></iframe>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'dashboard/js/owner_reports.js' %}?v=8"></script>
{% endblock %}
