<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Owner Update</title>
</head>
<body style="margin:0; padding:0; background-color:#EFF5F9; font-family:Georgia, serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EFF5F9;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1E3D58; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; font-family:Helvetica, Arial, sans-serif; font-size:26px; font-weight:700; color:#ffffff; letter-spacing:-0.5px;">
                Your {{ period_label }} Owner Update
              </h1>
              <p style="margin:8px 0 0; font-family:Helvetica, Arial, sans-serif; font-size:14px; color:#6EA5CD;">
                Vesta Property Management
              </p>
            </td>
          </tr>

          <!-- Greeting + Note Body -->
          <tr>
            <td style="padding:32px 40px;">
              <p style="margin:0; font-size:16px; line-height:1.5; color:#333333;">
                Hi {{ owner_first_name }},
              </p>
              <div style="margin:16px 0 0; font-size:15px; line-height:1.6; color:#555555;">
                {{ note_text|linebreaks }}
              </div>
            </td>
          </tr>

          <!-- Owner Portal CTA -->
          <tr>
            <td style="padding:16px 40px 32px; text-align:center;">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="https://vestapm.rentvine.com/portals/owner/" style="height:48px;v-text-anchor:middle;width:360px;" arcsize="13%" fillcolor="#1E3D58" stroke="f">
                <w:anchorlock/>
                <center style="color:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;">View full details in your owner portal</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!--><a href="https://vestapm.rentvine.com/portals/owner/" target="_blank" style="display:inline-block; padding:14px 32px; background-color:#1E3D58; color:#ffffff; font-family:Helvetica, Arial, sans-serif; font-size:15px; font-weight:600; text-decoration:none; border-radius:6px; mso-hide:all;">View full details in your owner portal</a><!--<![endif]-->
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:32px 40px; background-color:#1E3D58;">
              <p style="margin:0; font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#6EA5CD; text-align:center;">
                Questions? Reply to this email or call or text us at <a href="tel:+18284581396" style="color:#6EA5CD; text-decoration:none;">(828) 458-1396</a>.
              </p>
              <p style="margin:12px 0 0; font-family:Helvetica, Arial, sans-serif; font-size:11px; color:#4a7a9e; text-align:center;">
                Vesta Property Management &bull; Asheville, NC
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
