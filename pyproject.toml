[project]
name = "vesta-rental-index"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<24.0",
    "requests>=2.32,<3.0",
    "whitenoise>=6.8,<7.0",
    "dj-database-url>=2.3,<3.0",
    "django-anymail[sendgrid]>=12.0,<13.0",
    "openpyxl>=3.1.5",
    "slack-sdk>=3.0,<4.0",
    "anthropic>=0.40,<1.0",
    "python-json-logger>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "responses>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vesta_rental_index.settings"
pythonpath = ["."]
