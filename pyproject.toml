[project]
name = "vesta-dashboard"
version = "0.1.0"
description = "Vesta Property Management — owner communications engine"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "python-dotenv>=1.1",
    "python-json-logger>=3.3",
    "dj-database-url>=2.3",
    "requests>=2.32",
    "anthropic>=0.52",
    "sendgrid>=6.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests", "accounts", "core", "integrations", "maintenance", "comms"]
norecursedirs = ["_salvage", ".venv", ".git", "node_modules"]
