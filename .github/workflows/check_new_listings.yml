name: Check New Listings

on:
  schedule:
    - cron: '0 15 * * 1-5'  # 10am ET (UTC-5), Mon-Fri
  workflow_dispatch:

jobs:
  check-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger listing check
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-API-Key: ${{ secrets.VESTA_API_KEY }}" \
            "https://dashboard.vestapm.com/api/listing-alerts/check?limit=2")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Listing check triggered successfully"
            exit 0
          fi
          echo "Failed to trigger listing check"
          exit 1
